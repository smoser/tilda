unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g default-command "/bin/bash"
set-option -g history-limit 8192
# resize window, like screen 'ctrl-A F'
bind-key F resize-window -A
# alt-f to resize all windows (M-F is shift-alt-f)
bind-key M-f run-shell "tmux-resize-all '#{session_id}'"
bind-key M-F run-shell "tmux-resize-all '#{session_id}'"
# set -g window-size latest
# splits open in the current pane's directory
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"
# popup shell in the current pane's directory (e.g. a claude session's repo)
bind-key ` display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

set  -g status-style bg=green,fg=black
setw -g window-status-current-style bg=cyan

set-hook -g after-new-session {
  if-shell '[ "#{session_name}" = "browser-share" ]' {
    set  -g status-style bg=blue,fg=black
    setw -g window-status-current-style bg=lightblue
  }
}

# claude wrote these to try to help with /terminal-setup - does not seem to work
# Enable extended keys for better key combination support
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-kitty:extkeys'

# Enable focus events (helpful for various applications)
set -g focus-events on

# Allow applications to set the clipboard
set -g set-clipboard on

# Double-click selects whole "foo-bar", URLs and paths; the default breaks
# on nearly all punctuation.  Also affects copy-mode w/b/e.
set -g word-separators " '\"()<>[]{}|`,;"

# Sessions are saved and restored by lazarus
# (~/src/sandbox-of-power/smoser/lazarus), not tmux-resurrect/continuum.
