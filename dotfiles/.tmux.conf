unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g default-command "/bin/bash"
set-option -g history-limit 8192

set  -g status-style bg=green,fg=black
setw -g window-status-current-style bg=cyan

set-hook -g after-new-session {
  if-shell '[ "#{session_name}" = "browser-share" ]' {
    set  -g status-style bg=blue,fg=black
    setw -g window-status-current-style bg=lightblue
  }
}

# claude wrote these to try to help with /terminal-setup - does not seem to work
# Enable extended keys for better key combination support
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-kitty:extkeys'

# Enable focus events (helpful for various applications)
set -g focus-events on

# Allow applications to set the clipboard
set -g set-clipboard on

# resurrect/continuum: keep session layout across the nightly workstation
# reboot.  continuum only autosaves here; restore is manual, via the
# 'tmux-restore' command or prefix + C-r.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
# The default 'ps' capture flattens argv, so a saved command line cannot
# be replayed faithfully; linux_procfs reads /proc/<pid>/cmdline and
# shell-quotes each argument with printf %q.
set -g @resurrect-save-command-strategy 'linux_procfs'
# Restore claude panes with claude-resume-here.  A strategy script
# rather than resurrect's inline '->' form, for two reasons.  The
# inline form's ' *' token pastes the saved command line into a sed
# s/// replacement, which a comma in a saved review prompt breaks --
# resurrect then silently replays the raw, unquoted command line.  And
# it matches 'claude' anywhere, so it would hijack a pane running e.g.
# 'vim ~/.claude/settings.json'; a strategy is chosen from the first
# word of the command instead.
set -g @resurrect-processes '"~claude"'
set -g @resurrect-strategy-claude 'resume'
set -g @continuum-save-interval '5'
run-shell "$HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "$HOME/.tmux/plugins/tmux-continuum/continuum.tmux 2>/dev/null"
